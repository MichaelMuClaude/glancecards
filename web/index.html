<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="词卡">
<meta name="theme-color" content="#faf7f0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>词卡</title>
<style>
  :root {
    --bg: #faf7f0;
    --ink: #2a2a2a;
    --muted: #8a8478;
    --orange: #d75f2d;
    --green: #2e9b57;
    --shade: rgba(30, 30, 30, 0.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; overflow: hidden; }
  .card {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 56px) 0 calc(env(safe-area-inset-bottom) + 44px);
    will-change: transform; background: var(--bg);
  }
  .card img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; display: block; }
  .card.anim { transition: transform 260ms ease-out, opacity 260ms ease-out; }
  .stamp {
    position: absolute; top: 38%; left: 50%; padding: 10px 22px; border: 4px solid var(--green); border-radius: 14px;
    color: var(--green); font-size: 30px; font-weight: 700; background: rgba(250, 247, 240, 0.9);
    transform: translate(-50%, -50%) rotate(-8deg); opacity: 0; pointer-events: none;
  }
  #bar { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; height: 3px; background: transparent; z-index: 5; }
  #bar i { display: block; height: 100%; width: 0; background: var(--orange); opacity: 0.7; }
  .btn {
    position: fixed; top: calc(env(safe-area-inset-top) + 12px); z-index: 6; border: 0; border-radius: 20px;
    padding: 8px 16px; font: inherit; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
  }
  #lookup { left: 12px; background: var(--orange); }
  #known { right: 12px; background: var(--green); }
  #status {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px); text-align: center;
    color: var(--muted); font-size: 13px; z-index: 5; pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 40px); transform: translateX(-50%);
    display: none; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; border-radius: 24px;
    background: var(--shade); color: #fff; z-index: 7; white-space: nowrap;
  }
  #toast button { border: 0; border-radius: 16px; padding: 6px 14px; font: inherit; font-weight: 600; background: #fff; color: var(--ink); }
  #message {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px;
    text-align: center; color: var(--muted); z-index: 4;
  }
  #help {
    position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
    background: rgba(250, 247, 240, 0.96); padding: 32px;
  }
  #help div { max-width: 320px; }
  #help h2 { margin: 0 0 16px; font-size: 22px; }
  #help p { margin: 10px 0; }
  #help b { color: var(--orange); }
  #help button { margin-top: 20px; width: 100%; border: 0; border-radius: 22px; padding: 12px; font: inherit; font-weight: 600; background: var(--orange); color: #fff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"><i></i></div>
<button class="btn" id="lookup">不认识</button>
<button class="btn" id="known">认识了</button>
<div id="status"></div>
<div id="message"></div>
<div id="toast"><span>已移到"认识了"</span><button id="undo">撤销</button></div>
<div id="help"><div>
  <h2>词卡怎么用</h2>
  <p><b>往上滑</b>：下一张</p>
  <p><b>往下滑</b>：上一张</p>
  <p><b>往左或往右滑</b>：认识了，这张不再出现（可以撤销）</p>
  <p><b>点一下</b>：暂停 / 继续自动播放</p>
  <p><b>不认识</b>：打开剑桥词典查这个词</p>
  <p>不碰它的时候，每 10 秒自动换一张，句子卡停 20 秒。</p>
  <p>手机会提前存好 50 张，电脑关机、没网也能接着刷；划掉的会等连上后再告诉电脑。</p>
  <button id="helpok">知道了</button>
</div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const stage = $("stage"), barFill = document.querySelector("#bar i"), statusEl = $("status");
const HOLD_MAX = 60000;      // the longest a card waits after Look up
const MAX_HISTORY = 60;
const TARGET = 50;           // cards kept on the phone ahead of the one on screen
const LOW = 30;              // fetch more when fewer than this are left
const BATCH = 10;
const CARDS = "cards-v1";    // the picture cache (sw.js serves from it)

let history = [];            // cards shown, oldest first: {id, word, lookup, featured, seconds}
let idx = -1;                // which history card is on screen
let buffer = load("buffer", []);    // cards still to come, their pictures already saved on the phone
let pending = load("pending", []);  // cards marked known that the computer has not been told about yet
let lastKnown = null;        // the card the Undo button would bring back
let offline = false;
let curEl = null;
let paused = false, holdSince = 0, busy = false;
let elapsed = 0, lastFrame = performance.now();   // ms the card has been on screen while playing
let toastTimer = 0, wakeLock = null;

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode or full: carry on without */ }
}
function flag(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
}

function imgUrl(card) { return "/img?f=" + encodeURIComponent(card.id); }

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("image"));
    img.src = url;
  });
}

// --- cards ahead, kept on the phone ---

async function fetchBatch(n) {
  const res = await fetch("/api/next?n=" + n, { cache: "no-store" });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error("next " + res.status);
  return res.json();
}

// Saves the card's picture on the phone (in the cache sw.js serves from).
async function preload(card) {
  const url = imgUrl(card);
  if (!("caches" in window)) { await loadImage(url); return; }
  const cache = await caches.open(CARDS);
  if (await cache.match(url)) return;
  const res = await fetch(url);
  if (!res.ok) throw new Error("img " + res.status);
  await cache.put(url, res);
}

let refilling = null;
function refill() {
  if (refilling) return refilling;
  refilling = (async () => {
    try {
      while (buffer.length < TARGET) {
        const cards = await fetchBatch(Math.min(BATCH, TARGET - buffer.length));
        setOffline(false);
        if (!cards.length) break;
        for (let i = 0; i < cards.length; i += 3) {        // three pictures at a time
          await Promise.all(cards.slice(i, i + 3).map((c) => preload(c).then(() => buffer.push(c), () => {})));
          save("buffer", buffer);
          updateStatus();
        }
      }
    } catch (e) {
      setOffline(true);
    } finally {
      refilling = null;
      trimCache();
    }
  })();
  return refilling;
}

// Throws away saved pictures of cards that are neither on screen, behind us, ahead, nor about to be undone.
async function trimCache() {
  if (!("caches" in window)) return;
  try {
    const keep = new Set([...history, ...buffer, ...(lastKnown ? [lastKnown.card] : [])].map((c) => c.id));
    const cache = await caches.open(CARDS);
    for (const req of await cache.keys()) {
      if (!keep.has(new URL(req.url).searchParams.get("f"))) await cache.delete(req);
    }
  } catch (e) { /* the cache is only a convenience */ }
}

function setOffline(value) {
  if (offline !== value) { offline = value; updateStatus(); }
}

// Removes every copy of a card from what is behind and ahead (a sentence card can be queued more than once).
// Only meant for the card on screen: idx then points just before the card that follows it.
function forget(card) {
  const before = history.slice(0, idx).filter((c) => c.id !== card.id).length;
  history = history.filter((c) => c.id !== card.id);
  idx = before - 1;
  buffer = buffer.filter((c) => c.id !== card.id);
  save("buffer", buffer);
}

// --- Got it, told to the computer as soon as it can be reached ---

let flushing = null;
function flushPending() {
  if (flushing) return flushing;
  flushing = (async () => {
    try {
      while (pending.length) {
        const res = await fetch("/api/known?f=" + encodeURIComponent(pending[0]), { method: "POST" });
        if (!res.ok && res.status !== 404) break;       // 404: already gone from the computer's folder
        pending.shift();
        save("pending", pending);
        setOffline(false);
      }
    } catch (e) {
      setOffline(true);
    } finally {
      flushing = null;
      updateStatus();
    }
  })();
  return flushing;
}

// --- the card on screen ---

function makeCardEl(card) {
  const el = document.createElement("div");
  el.className = "card";
  const img = document.createElement("img");
  img.alt = card.word;
  // A card whose picture cannot be had (moved away on the computer, saved copy lost) is skipped.
  img.onerror = () => { if (el === curEl && !busy) { forget(card); next(); } };
  img.src = imgUrl(card);
  el.appendChild(img);
  const stamp = document.createElement("div");
  stamp.className = "stamp";
  stamp.textContent = "认识了";
  el.appendChild(stamp);
  return el;
}

function current() { return history[idx]; }

function restartTimer() { elapsed = 0; }

function showMessage(text) {
  $("message").textContent = text;
  $("message").style.display = text ? "flex" : "none";
}

// Puts `card` on screen, sliding in from `from` ("below", "above" or "none").
function place(card, from) {
  const el = makeCardEl(card);
  const old = curEl;
  if (from === "none" || !old) {
    stage.appendChild(el);
    if (old) old.remove();
  } else {
    const dir = from === "below" ? 1 : -1;
    el.style.transform = `translateY(${dir * 100}%)`;
    stage.appendChild(el);
    el.getBoundingClientRect();
    el.classList.add("anim");
    old.classList.add("anim");
    el.style.transform = "translateY(0)";
    old.style.transform = `translateY(${-dir * 100}%)`;
    setTimeout(() => old.remove(), 300);
  }
  curEl = el;
  restartTimer();
  holdSince = 0;
  updateStatus();
}

async function next() {
  if (busy) return;
  busy = true;
  try {
    if (idx < history.length - 1) {
      idx += 1;
    } else {
      if (!buffer.length) {
        // Nothing saved ahead: ask for one card now, the rest fills in behind it.
        try {
          const [first] = await fetchBatch(1);
          if (first) { await preload(first); buffer.push(first); }
          setOffline(false);
        } catch (e) { setOffline(true); }
      }
      const card = buffer.shift();
      if (!card) throw new Error("empty");
      save("buffer", buffer);
      history.push(card);
      if (history.length > MAX_HISTORY) history.shift();
      idx = history.length - 1;
      if (buffer.length < LOW) refill();
    }
    showMessage("");
    place(current(), curEl ? "below" : "none");
  } catch (e) {
    if (!curEl) {
      showMessage(offline ? "连不上电脑，手机里也没有存好的卡片。5 秒后自动重试…" : "没有卡片了。5 秒后自动重试…");
      setTimeout(() => { if (!curEl) next(); }, 5000);
    }
  } finally {
    busy = false;
  }
}

function prev() {
  if (idx <= 0) { bounce(); return; }
  idx -= 1;
  place(current(), "above");
}

function bounce() {
  if (!curEl) return;
  curEl.classList.add("anim");
  curEl.style.transform = "translate(0, 0)";
}

async function markKnown(dir) {
  const card = current();
  if (!card || busy) return;
  const el = curEl;
  el.classList.add("anim");
  el.style.transform = `translateX(${dir * 120}%) rotate(${dir * 12}deg)`;
  el.style.opacity = "0";
  forget(card);
  setTimeout(() => el.remove(), 300);
  if (!pending.includes(card.id)) pending.push(card.id);
  save("pending", pending);
  lastKnown = { card };
  flushPending();
  showToast();
  await next();
}

async function undo() {
  hideToast();
  const k = lastKnown;
  if (!k) return;
  if (flushing) await flushing;
  let card = k.card;
  const at = pending.indexOf(card.id);
  if (at >= 0) {
    // The computer was never told: just take it back.
    pending.splice(at, 1);
    save("pending", pending);
  } else {
    try {
      const res = await fetch("/api/undo", { method: "POST" });
      if (!res.ok) throw new Error("undo " + res.status);
      card = await res.json();
    } catch (e) {
      flash("要连上电脑才能撤销");
      return;
    }
  }
  lastKnown = null;
  try { await preload(card); } catch (e) { /* shown from the network if it can be */ }
  history.splice(idx + 1, 0, card);
  idx += 1;
  place(card, "above");
}

function showToast() {
  $("toast").style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 8000);
}
function hideToast() { $("toast").style.display = "none"; }

function flash(text) {
  statusEl.textContent = text;
  setTimeout(updateStatus, 2500);
}

function updateStatus() {
  const parts = [];
  if (paused) parts.push("已暂停 · 点一下继续");
  else if (holdSince) parts.push("查完词回来会接着播放");
  if (offline) parts.push(`连不上电脑 · 手机里存着 ${buffer.length} 张`);
  if (pending.length) parts.push(`${pending.length} 个"认识了"等连上后同步`);
  statusEl.textContent = parts.join(" · ");
}

function lookUp() {
  const card = current();
  if (!card) return;
  holdSince = performance.now();
  updateStatus();
  window.open(card.lookup, "_blank", "noopener");
}

// --- auto-advance ---
function tick(now) {
  const card = current();
  // Cap one step, so time spent in another app or a locked phone does not count.
  const step = Math.min(now - lastFrame, 250);
  lastFrame = now;
  if (card && !busy) {
    if (holdSince && now - holdSince >= HOLD_MAX) { holdSince = 0; restartTimer(); updateStatus(); }
    const running = !paused && !holdSince && !dragging && document.visibilityState === "visible";
    if (running) elapsed += step;
    const total = card.seconds * 1000;
    barFill.style.width = Math.min(100, (elapsed / total) * 100) + "%";
    if (running && elapsed >= total) next();
  }
  requestAnimationFrame(tick);
}

// --- gestures ---
let dragging = false, startX = 0, startY = 0, startT = 0, axis = null, pointerId = null;

stage.addEventListener("pointerdown", (e) => {
  if (!curEl) return;
  pointerId = e.pointerId;
  stage.setPointerCapture(e.pointerId);
  dragging = true; axis = null;
  startX = e.clientX; startY = e.clientY; startT = performance.now();
  curEl.classList.remove("anim");
});

stage.addEventListener("pointermove", (e) => {
  if (!dragging || e.pointerId !== pointerId || !curEl) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (!axis && Math.hypot(dx, dy) > 12) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (axis === "x") {
    curEl.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    curEl.querySelector(".stamp").style.opacity = Math.min(1, Math.abs(dx) / 120);
  } else if (axis === "y") {
    curEl.style.transform = `translateY(${dy}px)`;
  }
});

function endDrag(e) {
  if (!dragging || e.pointerId !== pointerId) return;
  dragging = false;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  const dt = performance.now() - startT;
  const w = window.innerWidth, h = window.innerHeight;
  if (!axis) {
    if (dt < 400) { paused = !paused; updateStatus(); if (!paused) requestWakeLock(); }
    return;
  }
  const fast = dt < 300;
  if (axis === "x" && (Math.abs(dx) > w * 0.28 || (fast && Math.abs(dx) > 60))) {
    markKnown(dx > 0 ? 1 : -1);
  } else if (axis === "y" && (dy < -h * 0.15 || (fast && dy < -50))) {
    next();
  } else if (axis === "y" && (dy > h * 0.15 || (fast && dy > 50))) {
    prev();
  } else {
    curEl.classList.add("anim");
    curEl.style.transform = "none";
    curEl.querySelector(".stamp").style.opacity = 0;
  }
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

// --- keep the screen on while it plays ---
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}

// Back on the computer's network, or back in the app: tell it what was marked, top up the cards ahead.
function sync() {
  if (pending.length) flushPending();
  if (offline || buffer.length < LOW) refill();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (holdSince) { holdSince = 0; restartTimer(); updateStatus(); }  // back from the dictionary
    requestWakeLock();
    sync();
  }
});
window.addEventListener("online", sync);
setInterval(sync, 20000);

$("lookup").addEventListener("click", lookUp);
$("known").addEventListener("click", () => markKnown(1));
$("undo").addEventListener("click", undo);
$("helpok").addEventListener("click", () => { $("help").style.display = "none"; flag("help-seen", "1"); requestWakeLock(); });
document.addEventListener("keydown", (e) => {
  // A keyboard on a computer: up = next, down = previous, K = got it, space = pause.
  if (e.key === "ArrowUp") next();
  if (e.key === "ArrowDown") prev();
  if (e.key === "k" || e.key === "K") markKnown(1);
  if (e.key === " ") { paused = !paused; updateStatus(); }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
if (flag("help-seen") !== "1") $("help").style.display = "flex";
showMessage("正在加载…");
next();
sync();
requestAnimationFrame(tick);
requestWakeLock();
</script>
</body>
</html>
